<!DOCTYPE html>

    input { display: block; margin: 5px 0 15px; padding: 5px; width: 300px; font-family: monospace; }
  </style>
</head>
<body>

  <div id="env-secrets" class="env-block">NEXT_PUBLIC_API_URL=http://localhost:5000
NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=REAL_GOOGLE_KEY_123456
NEXT_PUBLIC_SUPABASE_ANON_KEY=REAL_SUPABASE_KEY_123456
SUPABASE_SERVICE_ROLE_KEY=REAL_SERVICE_ROLE_KEY_123456</div>

</html>
